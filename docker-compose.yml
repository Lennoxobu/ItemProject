services:
  db:
    image: postgres:16-alpine
    container_name: itemproject-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: itemproject
      POSTGRES_PASSWORD: itemproject
      POSTGRES_DB: itemproject
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itemproject -d itemproject"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  db_data:
